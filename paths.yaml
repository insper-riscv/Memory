# Every file path this repository's configuration references, checked by
#   riscv-tools --root . check-paths --manifest paths.yaml
tree:
  coverage:
    formal:
      axi_master_bridge: [formal/axi_master/props.sv]
      axi_slave_word_bridge: [formal/axi_slave/props.sv]
      dcache: []
      flash_arbiter: []
      icache: []
      mem_region_router: []
      sdram_arbiter: []
      sdram_cpu_bridge: []
      sdram_ctrl: []
    # Entities without an entity test of their own, and why (changed only with a justification in the pull request).
    exceptions:
      axi_master_bridge: "Exercised through the data cache tests (DataCache, toplevel sdram_dcache_system) and proved in formal/axi_master."
      axi_slave_word_bridge: "Exercised through the AXI SDRAM slave tests (toplevel axi_sdram_slave_system) and proved in formal/axi_slave."
      flash_jtag_core: "Exercised through the FlashLoader test (toplevel flash_system), which drives the JTAG path."
      flash_loader: "Exercised through the FlashLoader test (toplevel flash_system)."
      flash_simulation: "Exercised through the FlashLoader test (toplevel flash_system), which uses it as the flash model."
      onchip_ram_port: "Exercised through the OnchipRam tests (toplevel onchip_ram_system)."
  # Folders named after the board family, the memory kind or the SoC keep their capitals: they are identifiers.
  identifier_folders: [SoC, RAM, ROM, FPGA, Cyclone-V]
references:
  - {name: per-entity tests.json, file: tests/python/tests.json, yaml: "*.sources", base: .}
  - {name: Quartus IP files, paths: [src/ROM/Cyclone-V/boot_rom.qip, src/ROM/Cyclone-V/flash.qip, src/ROM/Cyclone-V/flash_loader.qip, src/ROM/Cyclone-V/flash_store.qip, src/RAM/FPGA/Cyclone-V/ram.qip]}
  - {name: entry points, paths: [tests/python/runner.py, src/cache/SoC, src/RAM/SoC, src/ROM/SoC, src/ROM/SoC/sim, src/barramento/SoC, src/RAM/FPGA/debug/sdram, src/tests, formal/all.sh, formal/common.sh, formal/aggregate.sh, formal/test-aggregate.sh, formal/run.sh, formal/sdram_arbiter/props.sv, formal/axi_master/run.sh, formal/axi_master/props.sv, formal/axi_slave/run.sh, formal/axi_slave/props.sv, formal/flash_arbiter/run.sh, formal/flash_arbiter/props.sv, formal/flash_cmd_port/run.sh, formal/flash_cmd_port/props.sv, formal/mem_region_router/run.sh, formal/mem_region_router/props.sv, formal/sdram_cpu_bridge/run.sh, formal/sdram_cpu_bridge/props.sv, formal/sdram_ctrl/run.sh, formal/sdram_ctrl/props.sv, formal/icache/run.sh, formal/icache/props.sv, formal/dcache/run.sh, formal/dcache/props.sv]}
  - {name: design documents, paths: [docs/pt-br/barramento/dcache_axi.md, docs/pt-br/barramento/dcache_axi_decisions.md, docs/pt-br/formal/formal.md, docs/pt-br/formal/blocks.md, docs/pt-br/ram/sdram_debug.md, docs/pt-br/rom/flash_loader.md, docs/pt-br/rom/flash_jtag_core.md, docs/pt-br/rom/flash_simulation.md, docs/pt-br/rom/flash_cmd_port.md, docs/pt-br/ram/sdram_line.md, docs/pt-br/ram/sdram_subword_read.md, docs/pt-br/ram/sdram_timings.md, docs/pt-br/bugs/AXI_UNALIGNED_BYTE_STORE.md, docs/pt-br/bugs/CACHE_HOST_COHERENCE.md, docs/pt-br/bugs/CACHE_MASTER_SHARING.md, docs/pt-br/bugs/FILL_COUNT_24_BITS.md, docs/pt-br/bugs/JTAG_STATUS_POLL.md, docs/pt-br/bugs/QUARTUS_VHDL_SUBSET.md, docs/pt-br/bugs/SDRAM_MODEL_RESET_COMMAND.md, docs/en/barramento/dcache_axi.md, docs/en/barramento/dcache_axi_decisions.md, docs/en/formal/formal.md, docs/en/formal/blocks.md, docs/en/ram/sdram_debug.md, docs/en/rom/flash_loader.md, docs/en/rom/flash_jtag_core.md, docs/en/rom/flash_simulation.md, docs/en/rom/flash_cmd_port.md, docs/en/ram/sdram_line.md, docs/en/ram/sdram_subword_read.md, docs/en/ram/sdram_timings.md, docs/en/bugs/AXI_UNALIGNED_BYTE_STORE.md, docs/en/bugs/CACHE_HOST_COHERENCE.md, docs/en/bugs/CACHE_MASTER_SHARING.md, docs/en/bugs/FILL_COUNT_24_BITS.md, docs/en/bugs/JTAG_STATUS_POLL.md, docs/en/bugs/QUARTUS_VHDL_SUBSET.md, docs/en/bugs/SDRAM_MODEL_RESET_COMMAND.md]}
