# Every file path this repository's configuration references, checked by
#   riscv-tools --root . check-paths --manifest paths.yaml
repository: Memory
tree:
  coverage:
    formal:
      axi_master_bridge: [formal/axi_master/props.sv]
      axi_slave_word_bridge: [formal/axi_slave/props.sv]
      dcache: []
      flash_arbiter: []
      nor_flash_ctrl: [formal/nor_flash_ctrl/props.sv]
      max10_flash: [formal/max10_flash/props.sv]
      epcs_ctrl: [formal/epcs_ctrl/props.sv]
      sram_ctrl: [formal/sram_ctrl/props.sv]
      icache: []
      mem_region_router: []
      sdram_arbiter: []
      sdram_cpu_bridge: []
      sdram_ctrl: []
    exceptions:
      epcs_cmd: registers and sequencer of the epcs_ctrl, tested joined with the SPI master by the EpcsCtrl entry (bench epcs_ctrl_tb) and proven in the epcs_ctrl proof
      epcs_spi: SPI master of the epcs_ctrl, tested joined with the registers by the EpcsCtrl entry (bench epcs_ctrl_tb) and proven in the epcs_ctrl proof
      max10_flash_ip: thin shell of the IP max10_flash_core generated by Platform Designer, covered by the Quartus synthesis of the controller with the IP
      epcs_asmi_cyclone_iv_e: thin shell of the ASMI block of the Cyclone IV E, covered by the Quartus synthesis of the epcs_ctrl with it
  # Folders named after the board family, the memory kind or the SoC keep their capitals: they are identifiers.
  identifier_folders: [SoC, RAM, ROM, FPGA, Cyclone-V, Cyclone-IV-E, MAX-10]
  vhdl_style:
    # Thin shells that only instantiate by component the generated IP of the MAX 10 and the ASMI blocks of the Cyclone IV E and V:
    # vendor primitives that the vendor_primitives.yaml of riscv-tools does not list yet.
    exclude: [src/ROM/MAX-10/max10_flash_ip.vhd, src/ROM/Cyclone-IV-E/epcs_asmi_cyclone_iv_e.vhd, src/ROM/Cyclone-V/epcs_asmi_cyclone_v.vhd]
references:
  - {name: per-entity tests.json, file: tests/python/tests.json, yaml: "*.sources", base: .}
  - {name: Quartus IP files, paths: [src/ROM/Cyclone-V/boot_memory.qip, src/ROM/Cyclone-V/flash.qip, src/ROM/Cyclone-V/flash_loader.qip, src/ROM/Cyclone-V/flash_store.qip, src/RAM/FPGA/Cyclone-V/ram.qip, src/ROM/MAX-10/max10_flash_core.tcl]}
  - {name: entry points, paths: [tests/python/runner.py, src/cache/SoC, src/latency/SoC, src/RAM/SoC, src/ROM/SoC, src/ROM/SoC/sim, src/barramento/SoC, src/sim/SoC, src/RAM/FPGA/debug/sdram, src/tests, formal/all.sh, formal/common.sh, formal/aggregate.sh, formal/test-aggregate.sh, formal/run.sh, formal/sdram_arbiter/props.sv, formal/axi_master/run.sh, formal/axi_master/props.sv, formal/axi_slave/run.sh, formal/axi_slave/props.sv, formal/flash_arbiter/run.sh, formal/flash_arbiter/props.sv, formal/flash_cmd_port/run.sh, formal/flash_cmd_port/props.sv, formal/max10_flash/run.sh, formal/max10_flash/props.sv, formal/epcs_ctrl/run.sh, formal/epcs_ctrl/props.sv, formal/latency_counter/run.sh, formal/latency_counter/props.sv, formal/mem_region_router/run.sh, formal/mem_region_router/props.sv, formal/sdram_cpu_bridge/run.sh, formal/sdram_cpu_bridge/props.sv, formal/sdram_ctrl/run.sh, formal/sdram_ctrl/props.sv, formal/icache/run.sh, formal/icache/props.sv, formal/dcache/run.sh, formal/dcache/props.sv]}
  - {name: design documents, paths: [docs/pt-br/barramento/dcache_axi.md, docs/pt-br/barramento/dcache_axi_decisions.md, docs/pt-br/formal/formal.md, docs/pt-br/formal/blocks.md, docs/pt-br/ram/sdram_debug.md, docs/pt-br/rom/flash_loader.md, docs/pt-br/rom/flash_jtag_core.md, docs/pt-br/rom/flash_simulation.md, docs/pt-br/rom/flash_cmd_port.md, docs/pt-br/rom/nor_flash_ctrl.md, docs/pt-br/rom/nor_flash_model.md, docs/pt-br/rom/max10_flash.md, docs/pt-br/rom/epcs_ctrl.md, docs/pt-br/rom/chip_timing_pkg.md, docs/pt-br/cache/cache_pkg.md, docs/pt-br/ram/ram_pkg.md, docs/pt-br/sim/sim_util_pkg.md, docs/pt-br/ram/sram_ctrl.md, docs/pt-br/ram/sram_model.md, docs/pt-br/latency/latency_counter.md, docs/pt-br/ram/sdram_line.md, docs/pt-br/ram/sdram_subword_read.md, docs/pt-br/ram/sdram_timings.md, docs/pt-br/bugs/AXI_UNALIGNED_BYTE_STORE.md, docs/pt-br/bugs/CACHE_HOST_COHERENCE.md, docs/pt-br/bugs/CACHE_MASTER_SHARING.md, docs/pt-br/bugs/FILL_COUNT_24_BITS.md, docs/pt-br/bugs/JTAG_STATUS_POLL.md, docs/pt-br/bugs/QUARTUS_VHDL_SUBSET.md, docs/pt-br/bugs/SDRAM_MODEL_RESET_COMMAND.md, docs/en/barramento/dcache_axi.md, docs/en/barramento/dcache_axi_decisions.md, docs/en/formal/formal.md, docs/en/formal/blocks.md, docs/en/ram/sdram_debug.md, docs/en/rom/flash_loader.md, docs/en/rom/flash_jtag_core.md, docs/en/rom/flash_simulation.md, docs/en/rom/flash_cmd_port.md, docs/en/rom/nor_flash_ctrl.md, docs/en/rom/nor_flash_model.md, docs/en/rom/max10_flash.md, docs/en/rom/epcs_ctrl.md, docs/en/rom/chip_timing_pkg.md, docs/en/cache/cache_pkg.md, docs/en/ram/ram_pkg.md, docs/en/sim/sim_util_pkg.md, docs/en/ram/sram_ctrl.md, docs/en/ram/sram_model.md, docs/en/latency/latency_counter.md, docs/en/ram/sdram_line.md, docs/en/ram/sdram_subword_read.md, docs/en/ram/sdram_timings.md, docs/en/bugs/AXI_UNALIGNED_BYTE_STORE.md, docs/en/bugs/CACHE_HOST_COHERENCE.md, docs/en/bugs/CACHE_MASTER_SHARING.md, docs/en/bugs/FILL_COUNT_24_BITS.md, docs/en/bugs/JTAG_STATUS_POLL.md, docs/en/bugs/QUARTUS_VHDL_SUBSET.md, docs/en/bugs/SDRAM_MODEL_RESET_COMMAND.md]}

provides:
  # Each component lists its sources in GHDL dependency order and the components it needs. A requires with the
  # prefix Common-Components/ names a block of the submodule at src/common. The components of the sim folders
  # (models and systems) are the ones the entity tests build.
  # The functions the caches, the fetch bridge and the region router share: the test of an address in a region and the width of the line index.
  cache_pkg:
    requires: [Common-Components/utils]
    sources:
      - src/cache/SoC/cache_pkg.vhd
  # The offset of an address inside the window of a memory chip.
  ram_pkg:
    requires: []
    sources:
      - src/RAM/SoC/ram_pkg.vhd
  # The simulation helpers of the chip models and of the test systems; never synthesized.
  sim_util_pkg:
    requires: []
    sources:
      - src/sim/SoC/sim_util_pkg.vhd
  latency_counter:
    requires: []
    sources:
      - src/latency/SoC/latency_counter.vhd
  ram_simulation:
    requires: [Common-Components/utils]
    sources:
      - src/RAM/SoC/ram_simulation.vhd
  # The synthesizable port over a memory block alone: ram_chip.vhd is a simulation model (protected type) that Quartus rejects.
  onchip_ram_port:
    requires: [Common-Components/utils, latency_counter, ram_pkg]
    sources:
      - src/RAM/SoC/onchip_ram_port.vhd
  onchip_ram:
    requires: [Common-Components/utils, latency_counter, onchip_ram_port, ram_pkg]
    sources:
      - src/RAM/SoC/ram_chip.vhd
  ram_cyclone_v:
    requires: [Common-Components/utils, block_ram]
    sources:
      - src/RAM/FPGA/Cyclone-V/ram.vhd
  rom_simulation:
    requires: [Common-Components/utils]
    sources:
      - src/ROM/SoC/rom_simulation.vhd
  flash_simulation:
    requires: [Common-Components/utils]
    sources:
      - src/ROM/SoC/flash_simulation.vhd
  flash_loader:
    requires: [Common-Components/synchronizer]
    sources:
      - src/ROM/SoC/flash_jtag_core.vhd
      - src/ROM/SoC/flash_loader.vhd
  block_ram:
    requires: []
    sources:
      - src/block_ram/altera/block_ram.vhd
  boot_memory:
    requires: [Common-Components/utils, block_ram]
    sources:
      - src/ROM/Cyclone-V/boot_memory.vhd
  flash:
    requires: [Common-Components/utils, block_ram]
    sources:
      - src/ROM/Cyclone-V/flash.vhd
  flash_store:
    requires: [Common-Components/utils, block_ram]
    sources:
      - src/ROM/Cyclone-V/flash_store.vhd
  flash_jtag_shell:
    requires: [flash_loader, Common-Components/virtual_jtag]
    sources:
      - src/ROM/Cyclone-V/flash_jtag_shell.vhd
  sdram:
    requires: [Common-Components/synchronizer, chip_timing]
    sources:
      - src/RAM/SoC/sdram/sdram_pkg.vhd
      - src/RAM/SoC/sdram/sdram_ctrl.vhd
      - src/RAM/SoC/sdram/sdram_cpu_bridge.vhd
      - src/RAM/SoC/sdram/sdram_arbiter.vhd
  sdram_debug:
    requires: [Common-Components/synchronizer]
    sources:
      - src/RAM/FPGA/debug/sdram/sdram_dbg_master.vhd
      - src/RAM/FPGA/debug/sdram/sdram_jtag_core.vhd
  sdram_jtag_shell:
    requires: [sdram_debug, Common-Components/virtual_jtag]
    sources:
      - src/RAM/FPGA/Cyclone-V/sdram_jtag_shell.vhd
  axi_master_bridge:
    requires: []
    sources:
      - src/barramento/SoC/axi_master_bridge.vhd
  axi_slave_word_bridge:
    requires: []
    sources:
      - src/barramento/SoC/axi_slave_word_bridge.vhd
  icache:
    requires: [Common-Components/utils, cache_pkg]
    sources:
      - src/cache/SoC/icache.vhd
  dcache:
    requires: [Common-Components/utils, cache_pkg]
    sources:
      - src/cache/SoC/dcache.vhd
  flash_chip:
    requires: [Common-Components/utils, latency_counter]
    sources:
      - src/cache/SoC/flash_chip.vhd
  flash_cmd_port:
    requires: [Common-Components/utils, chip_timing]
    sources:
      - src/cache/SoC/flash_cmd_port.vhd
  flash_arbiter:
    requires: []
    sources:
      - src/cache/SoC/flash_arbiter.vhd
  mem_region_router:
    requires: [Common-Components/utils, cache_pkg]
    sources:
      - src/cache/SoC/mem_region_router.vhd
  ifetch_bridge:
    requires: [Common-Components/utils, cache_pkg]
    sources:
      - src/cache/SoC/ifetch_bridge.vhd
  chip_timing:
    requires: []
    sources:
      - src/ROM/SoC/chip_timing_pkg.vhd
  nor_flash_ctrl:
    needs: [nor]
    requires: [Common-Components/utils, Common-Components/synchronizer, chip_timing, latency_counter]
    sources:
      - src/ROM/SoC/nor_flash_ctrl.vhd
  nor_flash_model:
    requires: [Common-Components/utils, chip_timing, sim_util_pkg]
    sources:
      - src/ROM/SoC/sim/nor_flash_model.vhd
  nor_flash_ctrl_tb:
    requires: [nor_flash_ctrl, nor_flash_model]
    sources:
      - src/ROM/SoC/sim/nor_flash_ctrl_tb.vhd
  sram_ctrl:
    needs: [sram]
    requires: [Common-Components/utils, chip_timing, latency_counter, ram_pkg]
    sources:
      - src/RAM/SoC/sram_ctrl.vhd
  sram_model:
    requires: [Common-Components/utils, chip_timing, sim_util_pkg]
    sources:
      - src/RAM/SoC/sim/sram_model.vhd
  sram_ctrl_tb:
    requires: [sram_ctrl, sram_model]
    sources:
      - src/RAM/SoC/sim/sram_ctrl_tb.vhd
  sdram_model:
    requires: [sdram]
    sources:
      - src/RAM/SoC/sim/sdram_model.vhd
  sdram_system:
    requires: [sdram, sdram_debug, sdram_model]
    sources:
      - src/RAM/SoC/sim/sdram_system.vhd
  sdram_bist:
    requires: [sdram, sdram_model]
    sources:
      - src/tests/sdram_bist.vhd
      - src/tests/sdram_bist_system.vhd
  onchip_ram_system:
    requires: [Common-Components/utils, onchip_ram, ram_simulation, dcache]
    sources:
      - src/RAM/SoC/sim/onchip_ram_system.vhd
  flash_system:
    requires: [Common-Components/utils, flash_simulation, flash_loader]
    sources:
      - src/ROM/SoC/sim/flash_system.vhd
  axi_sdram_slave_system:
    requires: [sdram, sdram_system, axi_slave_word_bridge]
    sources:
      - src/barramento/SoC/sim/axi_sdram_slave_system.vhd
  sdram_dcache_system:
    requires: [sdram, sdram_system, axi_master_bridge, axi_slave_word_bridge, dcache]
    sources:
      - src/cache/SoC/sim/sdram_dcache_system.vhd
  flash_dual_system:
    requires: [Common-Components/utils, flash_simulation, flash_chip, flash_cmd_port]
    sources:
      - src/cache/SoC/sim/flash_dual_system.vhd
  # The fetch path of the tests of the instruction cache (FlashPath) and of the fetch bridge (IfetchPath), chosen by the generic use_bridge.
  flash_path_system:
    requires: [Common-Components/utils, icache, ifetch_bridge, flash_chip, mem_region_router, flash_arbiter, sim_util_pkg]
    sources:
      - src/cache/SoC/sim/flash_path_system.vhd
  # The bus controller of the user flash of the MAX 10 (DE10-Lite); the Avalon-MM ports go to the generated IP (src/ROM/MAX-10).
  max10_flash:
    requires: []
    sources:
      - src/ROM/SoC/max10_flash.vhd
  max10_flash_model:
    requires: []
    sources:
      - src/ROM/SoC/sim/max10_flash_model.vhd
  max10_flash_tb:
    requires: [max10_flash, max10_flash_model]
    sources:
      - src/ROM/SoC/sim/max10_flash_tb.vhd
  # The thin shell of the generated IP max10_flash_core (src/ROM/MAX-10/max10_flash_core.tcl); only Quartus builds it.
  max10_flash_ip:
    requires: []
    sources:
      - src/ROM/MAX-10/max10_flash_ip.vhd
  # The user access to the serial configuration flash: the SPI master, the registers and guard, and the top that joins them.
  epcs_spi:
    requires: []
    sources:
      - src/ROM/SoC/epcs_spi.vhd
  epcs_cmd:
    requires: []
    sources:
      - src/ROM/SoC/epcs_cmd.vhd
  epcs_ctrl:
    requires: [epcs_spi, epcs_cmd]
    sources:
      - src/ROM/SoC/epcs_ctrl.vhd
  epcs_model:
    requires: []
    sources:
      - src/ROM/SoC/sim/epcs_model.vhd
  epcs_ctrl_tb:
    requires: [epcs_ctrl, epcs_model]
    sources:
      - src/ROM/SoC/sim/epcs_ctrl_tb.vhd
  # The ASMI blocks that take the SPI pins of the epcs_ctrl to the dedicated configuration pins; only Quartus builds them.
  epcs_asmi_cyclone_iv_e:
    requires: []
    sources:
      - src/ROM/Cyclone-IV-E/epcs_asmi_cyclone_iv_e.vhd
  epcs_asmi_cyclone_v:
    requires: []
    sources:
      - src/ROM/Cyclone-V/epcs_asmi_cyclone_v.vhd
