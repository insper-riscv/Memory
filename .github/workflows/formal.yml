name: formal

on:
  push:
    paths:
      - external/sdram/sdram_arbiter.vhd
      - formal/**
      - .github/workflows/formal.yml
  pull_request:
    paths:
      - external/sdram/sdram_arbiter.vhd
      - formal/**
      - .github/workflows/formal.yml
  workflow_dispatch:

concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arbiter:
    # Needs no hardware and no Quartus license. insper-riscv/Infra's toolchain image has GHDL, Yosys,
    # SymbiYosys and the z3 solver on PATH (docs/en/TOOLCHAIN_IMAGE.md there, section 3.2).
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/insper-riscv/infra-toolchain:latest

    steps:
      - uses: actions/checkout@v7

      - name: The formal tools are in the image
        run: |
          for tool in ghdl yosys sby z3; do
            command -v "$tool" > /dev/null || { echo "::error::$tool is not in the toolchain image"; exit 1; }
          done

      - name: Prove the properties of the SDRAM arbiter
        run: make formal

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: formal-logs
          path: build/formal/*.log
          if-no-files-found: ignore
