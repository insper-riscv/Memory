name: ci

# One run per commit: a pull request (a new commit cancels the run of the previous one) or a push to
# main. The jobs vhdl-syntax, unit-tests, formal and python-static-analysis have fixed names, which a ruleset of the
# organization can require as checks; the jobs "formal - <engine>" are not required (see formal below).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  vhdl-syntax:
    name: vhdl-syntax
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # GHDL, Yosys, SymbiYosys, z3, uv and riscv-tools of insper-riscv/Infra.
    container:
      image: ghcr.io/insper-riscv/ci-vhdl:latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Every referenced path exists
        run: make paths

      - name: VHDL syntax check (GHDL, dependency order)
        run: make check

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container:
      image: ghcr.io/insper-riscv/ci-vhdl:latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Python dependencies (cocotb; riscv-tools comes from the image)
        run: uv sync

      - name: Per-entity cocotb tests
        run: make test

      - name: Upload waveforms
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: waveforms
          path: "**/*.ghw"
          if-no-files-found: ignore

  formal-engine:
    # One job by engine, each running every proof (make formal). A broken engine makes its own job fail and
    # nothing else: the job formal below decides across the engines, and only formal is a required check,
    # because a ruleset needs every required check to pass.
    name: formal - ${{ matrix.engine }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [yices, bitwuzla, boolector, abc-bmc3]
    container:
      image: ghcr.io/insper-riscv/ci-vhdl:latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Prove with the engine
        run: make formal FORMAL_ENGINE=${{ matrix.engine }}

      - name: Upload the results and the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: formal-${{ matrix.engine }}
          path: |
            build/formal-results/
            build/formal/**/*.log
            build/formal_axi/**/*.log
            build/formal_axi_slave/**/*.log
          if-no-files-found: ignore

  formal:
    # Decides across the engines (formal/aggregate.sh): every proof needs an answer, the answers must agree and be
    # the expected one, and an engine that failed or cannot run a kind of proof gives no answer. It runs even when
    # an engine job failed (always): a job that is skipped would count as passed for the ruleset.
    name: formal
    needs: formal-engine
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        # with no artifact at all, the script below fails with the reason
        continue-on-error: true
        with:
          pattern: formal-*
          path: formal-results

      - name: Test the aggregation
        run: bash formal/test-aggregate.sh

      - name: Decide across the engines
        run: bash formal/aggregate.sh formal-results

  python-static-analysis:
    name: python-static-analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # The tools that need no project environment come pinned in the image (pylint, pyright, deptry and uv audit run with `uv run` in the environment `uv sync` builds).
    container:
      image: ghcr.io/insper-riscv/ci-vhdl:latest

    steps:
      - uses: actions/checkout@v7

      - name: Install the project
        run: uv sync --locked

      - name: ruff lint
        if: ${{ !cancelled() }}
        run: ruff check .

      - name: ruff format
        if: ${{ !cancelled() }}
        run: ruff format . --check

      - name: pycodestyle
        if: ${{ !cancelled() }}
        run: pycodestyle --max-line-length=79 --max-doc-length=72 --exclude=Common-Components,build,.venv,sim_build,__pycache__ .

      - name: pydocstyle
        if: ${{ !cancelled() }}
        run: pydocstyle --convention=pep257 --match-dir='^(?!(Common-Components|build|\.venv|sim_build|__pycache__)).*' .

      - name: pylint
        if: ${{ !cancelled() }}
        run: uv run pylint .

      - name: pyright
        if: ${{ !cancelled() }}
        run: uv run pyright

      - name: pyrefly
        if: ${{ !cancelled() }}
        run: pyrefly check

      - name: deptry
        if: ${{ !cancelled() }}
        run: uv run deptry .

      - name: complexipy
        if: ${{ !cancelled() }}
        run: complexipy .

      - name: codeclone
        if: ${{ !cancelled() }}
        run: codeclone . --fail-on-new

      - name: semgrep
        if: ${{ !cancelled() }}
        run: semgrep scan --config p/python --error .

      - name: uv audit
        if: ${{ !cancelled() }}
        run: uv audit
