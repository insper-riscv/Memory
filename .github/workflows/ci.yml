name: ci

# One run per commit: a pull request (a new commit cancels the run of the previous one) or a push to
# main. The jobs vhdl-syntax, unit-tests, formal and python-static-analysis have fixed names, which a ruleset of
# the organization can require as checks; the jobs "formal - <engine>" are not required (see formal below).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Reuses the pull request result: a push to main whose merge commit joins a head that this same
  # workflow already passed in a run that started after the first parent (the base) existed, holds
  # the tree that was tested, because main did not move in between; the jobs below are skipped.
  # Any doubt (no match, API error) runs everything.
  reuse:
    name: reuse
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.lookup.outputs.skip }}
      images: ${{ steps.plan.outputs.images }}
      gates: ${{ steps.plan.outputs.gates }}

    steps:
      - uses: actions/checkout@v7

      # The digests of the CI images (ci-images.lock) and, for each gate, the key of its inputs: a gate whose
      # key already has a pass (artifact ci-pass-<gate>-<key>) is skipped, whatever the commit, branch or event.
      - name: Read the image digests and look for a pass of the same inputs
        id: plan
        uses: insper-riscv/Infra/.github/actions/ci-plan@onda1
        with:
          gates: |
            formal|ci-vhdl|!docs/** !**/*.md !LICENSE !AUTHORS* !CITATION.cff !codeclone.baseline.json !ci-images.lock !.github/workflows/version-bump.yml !.github/workflows/tree.yml !pyproject.toml !uv.lock
            unit-tests|ci-vhdl|!docs/** !**/*.md !LICENSE !AUTHORS* !CITATION.cff !codeclone.baseline.json !ci-images.lock !.github/workflows/version-bump.yml !.github/workflows/tree.yml !formal/**

      - name: Look for a passed pull request run of the same tree
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          skip=false
          if [ "$EVENT" = push ]; then
            parents=$(gh api "repos/$REPO/commits/$SHA" --jq '[.parents[].sha] | join(" ")' || true)
            read -r base head extra <<< "$parents"
            if [ -n "${head:-}" ] && [ -z "${extra:-}" ]; then
              basedate=$(gh api "repos/$REPO/commits/$base" --jq '.commit.committer.date' || true)
              export BASEDATE="${basedate:-9999}"
              found=$(gh api "repos/$REPO/actions/runs?head_sha=$head&event=pull_request&status=success&per_page=100" \
                --jq '[.workflow_runs[] | select(.name == $ENV.WORKFLOW and .created_at >= $ENV.BASEDATE)] | length' || echo 0)
              if [ "${found:-0}" -gt 0 ]; then
                skip=true
                echo "::notice::Reusing the passed pull request run of $head over base $base."
              fi
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  vhdl-syntax:
    name: vhdl-syntax
    needs: reuse
    if: ${{ needs.reuse.outputs.skip != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # GHDL, Yosys, SymbiYosys, z3, uv and riscv-tools of insper-riscv/Infra.
    container:
      image: ${{ fromJSON(needs.reuse.outputs.images)['ci-vhdl'] }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Every referenced path exists
        run: make paths

      - name: VHDL style (header, ports, docstrings, naming)
        run: riscv-tools --root . check-vhdl-style

      - name: VHDL syntax check (GHDL, dependency order)
        run: make check

  unit-tests:
    name: unit-tests
    needs: reuse
    if: ${{ needs.reuse.outputs.skip != 'true' && fromJSON(needs.reuse.outputs.gates)['unit-tests'].skip != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container:
      image: ${{ fromJSON(needs.reuse.outputs.images)['ci-vhdl'] }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Python dependencies (cocotb; riscv-tools comes from the image)
        run: uv sync

      - name: Per-entity cocotb tests
        run: make test

      - name: Record the pass of these inputs
        # Only reached when every step above passed: a later run with the same key skips this gate.
        env:
          KEY: ${{ fromJSON(needs.reuse.outputs.gates)['unit-tests'].key }}
        run: echo "$KEY" > ci-pass.txt

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ fromJSON(needs.reuse.outputs.gates)['unit-tests'].artifact }}
          path: ci-pass.txt
          overwrite: true

      - name: Upload waveforms
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: waveforms
          path: "**/*.ghw"
          if-no-files-found: ignore

  formal-engine:
    # One job by engine, each running every proof (make formal). A broken engine makes its own job fail and
    # nothing else: the job formal below decides across the engines, and only formal is a required check,
    # because a ruleset needs every required check to pass.
    name: formal - ${{ matrix.engine }}
    needs: reuse
    if: ${{ needs.reuse.outputs.skip != 'true' && fromJSON(needs.reuse.outputs.gates)['formal'].skip != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [yices, bitwuzla, boolector, abc-bmc3]
    container:
      image: ${{ fromJSON(needs.reuse.outputs.images)['ci-vhdl'] }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Prove with the engine
        run: make formal FORMAL_ENGINE=${{ matrix.engine }}

      - name: Upload the results and the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: formal-${{ matrix.engine }}
          path: |
            build/formal-results/
            build/formal/**/*.log
            build/formal_axi/**/*.log
            build/formal_axi_slave/**/*.log
          if-no-files-found: ignore

  formal:
    # Decides across the engines (formal/aggregate.sh): every proof needs an answer, the answers must agree and be
    # the expected one, and an engine that failed or cannot run a kind of proof gives no answer. It runs even when
    # an engine job failed (always): a job that is skipped would count as passed for the ruleset. When the
    # result of the pull request is reused (reuse), the engines are skipped and so is this job.
    name: formal
    needs: [reuse, formal-engine]
    if: ${{ always() && needs.reuse.outputs.skip != 'true' && fromJSON(needs.reuse.outputs.gates)['formal'].skip != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        # with no artifact at all, the script below fails with the reason
        continue-on-error: true
        with:
          pattern: formal-*
          path: formal-results

      - name: Test the aggregation
        run: bash formal/test-aggregate.sh

      - name: Decide across the engines
        run: bash formal/aggregate.sh formal-results

      - name: Record the pass of these inputs
        # Only reached when every step above passed: a later run with the same key skips this gate.
        env:
          KEY: ${{ fromJSON(needs.reuse.outputs.gates)['formal'].key }}
        run: echo "$KEY" > ci-pass.txt

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ fromJSON(needs.reuse.outputs.gates)['formal'].artifact }}
          path: ci-pass.txt
          overwrite: true

  python-static-analysis:
    name: python-static-analysis
    needs: reuse
    if: ${{ needs.reuse.outputs.skip != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # The tools that need no project environment come pinned in the image (pylint, pyright, deptry and uv audit run with `uv run` in the environment `uv sync` builds).
    container:
      image: ${{ fromJSON(needs.reuse.outputs.images)['ci-vhdl'] }}

    steps:
      - uses: actions/checkout@v7

      - name: Install the project
        run: uv sync --locked

      - name: ruff lint
        if: ${{ !cancelled() }}
        run: ruff check .

      - name: ruff format
        if: ${{ !cancelled() }}
        run: ruff format . --check

      - name: pycodestyle
        if: ${{ !cancelled() }}
        run: pycodestyle --max-line-length=79 --max-doc-length=72 --exclude=src/common,build,.venv,sim_build,__pycache__ .

      - name: pydocstyle
        if: ${{ !cancelled() }}
        run: pydocstyle --convention=pep257 --match-dir='^(?!(src/common|build|\.venv|sim_build|__pycache__)).*' .

      - name: pylint
        if: ${{ !cancelled() }}
        run: uv run pylint .

      - name: pyright
        if: ${{ !cancelled() }}
        run: uv run pyright

      - name: pyrefly
        if: ${{ !cancelled() }}
        run: pyrefly check

      - name: deptry
        if: ${{ !cancelled() }}
        run: uv run deptry .

      - name: complexipy
        if: ${{ !cancelled() }}
        run: complexipy .

      - name: codeclone
        if: ${{ !cancelled() }}
        run: codeclone . --fail-on-new

      - name: semgrep
        if: ${{ !cancelled() }}
        run: semgrep scan --config p/python --error .

      - name: uv audit
        if: ${{ !cancelled() }}
        run: uv audit
