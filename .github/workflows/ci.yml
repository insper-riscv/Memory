name: ci

# One run per commit: a pull request (a new commit cancels the run of the previous one) or a push to
# main. The four jobs have fixed names, which a ruleset of the organization can require as checks.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Reuses the pull request result: a push to main whose merge commit joins a head that this same
  # workflow already passed in a run that started after the first parent (the base) existed, holds
  # the tree that was tested, because main did not move in between; the jobs below are skipped.
  # Any doubt (no match, API error) runs everything.
  reuse:
    name: reuse
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.lookup.outputs.skip }}

    steps:
      - name: Look for a passed pull request run of the same tree
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          skip=false
          if [ "$EVENT" = push ]; then
            parents=$(gh api "repos/$REPO/commits/$SHA" --jq '[.parents[].sha] | join(" ")' || true)
            read -r base head extra <<< "$parents"
            if [ -n "${head:-}" ] && [ -z "${extra:-}" ]; then
              basedate=$(gh api "repos/$REPO/commits/$base" --jq '.commit.committer.date' || true)
              export BASEDATE="${basedate:-9999}"
              found=$(gh api "repos/$REPO/actions/runs?head_sha=$head&event=pull_request&status=success&per_page=100" \
                --jq '[.workflow_runs[] | select(.name == $ENV.WORKFLOW and .created_at >= $ENV.BASEDATE)] | length' || echo 0)
              if [ "${found:-0}" -gt 0 ]; then
                skip=true
                echo "::notice::Reusing the passed pull request run of $head over base $base."
              fi
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  vhdl-syntax:
    name: vhdl-syntax
    needs: reuse
    if: ${{ needs.reuse.outputs.skip != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # GHDL, Yosys, SymbiYosys, z3, uv and riscv-tools of insper-riscv/Infra.
    container:
      image: ghcr.io/insper-riscv/ci-vhdl:latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Every referenced path exists
        run: make paths

      - name: VHDL syntax check (GHDL, dependency order)
        run: make check

  unit-tests:
    name: unit-tests
    needs: reuse
    if: ${{ needs.reuse.outputs.skip != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container:
      image: ghcr.io/insper-riscv/ci-vhdl:latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Python dependencies (cocotb; riscv-tools comes from the image)
        run: uv sync

      - name: Per-entity cocotb tests
        run: make test

      - name: Upload waveforms
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: waveforms
          path: "**/*.ghw"
          if-no-files-found: ignore

  formal:
    name: formal
    needs: reuse
    if: ${{ needs.reuse.outputs.skip != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    container:
      image: ghcr.io/insper-riscv/ci-vhdl:latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Prove every make target named formal*
        # A repository without proofs passes with a message; the proofs join by adding a formal target.
        run: |
          targets=$(sed -n 's/^\(formal[a-z-]*\):.*/\1/p' Makefile)
          if [ -z "$targets" ]; then
            echo "This repository has no formal proofs yet."
          fi
          status=0
          for target in $targets; do
            make "$target" || status=1
          done
          exit $status

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: formal-logs
          path: build/formal/**/*.log
          if-no-files-found: ignore

  python-static-analysis:
    name: python-static-analysis
    needs: reuse
    if: ${{ needs.reuse.outputs.skip != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # The tools that need no project environment come pinned in the image (pylint, pyright, deptry and uv audit run with `uv run` in the environment `uv sync` builds).
    container:
      image: ghcr.io/insper-riscv/ci-vhdl:latest

    steps:
      - uses: actions/checkout@v7

      - name: Install the project
        run: uv sync --locked

      - name: ruff lint
        if: ${{ !cancelled() }}
        run: ruff check .

      - name: ruff format
        if: ${{ !cancelled() }}
        run: ruff format . --check

      - name: pycodestyle
        if: ${{ !cancelled() }}
        run: pycodestyle --max-line-length=79 --max-doc-length=72 --exclude=Common-Components,build,.venv,sim_build,__pycache__ .

      - name: pydocstyle
        if: ${{ !cancelled() }}
        run: pydocstyle --convention=pep257 --match-dir='^(?!(Common-Components|build|\.venv|sim_build|__pycache__)).*' .

      - name: pylint
        if: ${{ !cancelled() }}
        run: uv run pylint .

      - name: pyright
        if: ${{ !cancelled() }}
        run: uv run pyright

      - name: pyrefly
        if: ${{ !cancelled() }}
        run: pyrefly check

      - name: deptry
        if: ${{ !cancelled() }}
        run: uv run deptry .

      - name: complexipy
        if: ${{ !cancelled() }}
        run: complexipy .

      - name: codeclone
        if: ${{ !cancelled() }}
        run: codeclone . --fail-on-new

      - name: semgrep
        if: ${{ !cancelled() }}
        run: semgrep scan --config p/python --error .

      - name: uv audit
        if: ${{ !cancelled() }}
        run: uv audit
