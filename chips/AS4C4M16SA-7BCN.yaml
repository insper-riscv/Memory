# SDRAM da Arduino MKR Vidor 4000 (Alliance Memory AS4C4M16SA-7BCN, 64 Mbit, 4M x 16, 143 MHz, CL3). O chip e a organizacao
# (A0 a A11, BS0 e BS1, 16 bits de dado) sao confirmados pelo esquematico (U9A); os tempos sao os do datasheet da serie -7 e precisam ser conferidos.
chip: AS4C4M16SA-7BCN
kind: sdram
organization: {words: 4194304, width: 16, banks: 4, row_bits: 12, col_bits: 8}
cas_latency: 3
timing:
  tck_ps: 7000
  trcd_ps: 15000
  trp_ps: 15000
  tras_ps: 37000
  trc_ps: 60000
  trfc_ps: 60000
  twr_ps: 14000
  tmrd_ck: 2
  tinit_ps: 200000000
  trefi_ps: 15625000
  init_refreshes: 8
io_timing: {input_setup_ns: 1.5, input_hold_ns: 0.8, access_ns: 5.4, output_hold_ns: 2.5}
max_mhz: 143
source: inferido
