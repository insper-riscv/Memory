# FLASH serial QSPI da Arduino MKR Vidor 4000 (Winbond W25Q16DVSNIG, 16 Mbit, SPI). Confirmada pelo esquematico
# (ABX00022, rede CFG_*), nao pelo datasheet: setor de 4 KiB e pagina de 256 bytes sao os da familia W25Q e precisam
# ser conferidos. read_spi_mhz e fast_read_spi_mhz sao os tetos do clock SPI das instrucoes READ (0x03) e FAST_READ (0x0B)
# que o epcs_xip usa, os da familia W25Q, a conferir.
chip: W25Q16DV
kind: serial_flash
organization: {words: 2097152, width: 8}
timing: {max_spi_mhz: 50, read_spi_mhz: 50, fast_read_spi_mhz: 104}
sector_bytes: 4096
max_mhz: 50
source: inferido
